name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Offline unit tests
        run: go test ./...
      - name: Offline image helper tests
        run: python3 -m unittest discover -s scripts -p '*_test.py'
      - name: Compile browser and integration fixtures without running
        run: go test -tags 'integration browser' -run '^$' ./...
