# Modified distribution: build this checkout, not an upstream binary image.
services:
  xiaohongshu-mcp:
    build:
      context: ..
      dockerfile: Dockerfile
    image: xiaohongshu-mcp:local
    platform: linux/amd64
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./images:/app/images
    environment:
      COOKIES_PATH: /app/data/cookies.json
      AUTH_TOKEN: ${AUTH_TOKEN:-}
      XHS_PROXY: ${XHS_PROXY:-}
    ports:
      - "127.0.0.1:18060:18060"
